services:
  db:
    image: postgres:16-alpine
    container_name: aq-postgres
    environment:
      POSTGRES_USER: air
      POSTGRES_PASSWORD: air
      POSTGRES_DB: airquality
    ports:
      - "55432:5432"
    volumes:
      - aqdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air -d airquality"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aqdata:
